name: ChromiumCore CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Download-page artifact checks are excluded until real release binaries are published.
      - run: npx playwright test --grep-invert "download|platform buttons|unavailable|file removed"

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-desktop.mjs
      - run: npm test --prefix .desktop-build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      # This project stores a base64 recovery copy of gradle-wrapper.jar; the
      # packaging script restores it, runs unit tests, assembles and verifies the APK.
      - name: Build the Android TV app
        run: node scripts/package-android.mjs 2>&1 | tee android-tv-build.log
      # Keep the compilation ZIP (the thing users download to build on their
      # own machines) building on every change too.
      - run: node scripts/package-android-source.mjs
      # Job logs are not always downloadable from every environment, so a
      # failed build throws its log tail as an error annotation: the reason
      # is visible on the run page and via the check annotations API.
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try {
              tail = fs.readFileSync('android-tv-build.log', 'utf8').trim().split('\n').slice(-60).join('\n');
            } catch (e) { /* no log captured */ }
            throw new Error(
              'ChromiumCore Android TV build failed on ubuntu-latest (node ' + process.version +
              '), commit ' + (context.sha || '?') + '.\n--- log tail ---\n' +
              (tail || '(no output captured)')
            );
