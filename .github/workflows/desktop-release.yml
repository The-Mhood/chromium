name: Build Desktop Preview
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          # macos-14 (Apple Silicon) is being retired by GitHub and its jobs
          # get cancelled within seconds; build arm64 on the current image.
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pkg
        shell: bash
        run: |
          # tee the output so the failure step can report it: the log
          # artifact is not reachable from every environment.
          node scripts/package-desktop.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} 2>&1 | tee package.log
          exit "${PIPESTATUS[0]}"
      # A failed package job throws its log tail as an error annotation, so
      # the failure reason is visible on the run page (and via the API) even
      # where log artifacts cannot be downloaded. No write permission needed.
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try {
              tail = fs.readFileSync('package.log', 'utf8').trim().split('\n').slice(-60).join('\n');
            } catch (e) { /* no log captured */ }
            throw new Error(
              'ChromiumCore packaging failed on ' + (process.env.RUNNER_OS || '?') +
              ' (node ' + process.version + '), target ${{ matrix.platform }}/${{ matrix.arch }}, ' +
              'commit ' + (context.sha || '?') + '.\n--- log tail ---\n' +
              (tail || '(no output captured)')
            );
      - uses: actions/upload-artifact@v4
        with:
          name: ChromiumCore-${{ matrix.platform }}-${{ matrix.arch }}
          # Windows is the NSIS installer (.exe); macOS is the ZIP. Each job
          # produces exactly one of the two, so listing both patterns is safe.
          path: |
            public/download/ChromiumCore-*.zip
            public/download/ChromiumCore-*.exe
          if-no-files-found: error

  # The Android TV target: the signed release APK plus the self-contained
  # compilation ZIP (sources + build instructions for building on a Mac).
  # Independent of the desktop matrix, so it cannot break the desktop builds.
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - name: Build the Android TV APK and compilation ZIP
        run: |
          # tee both builds to one log so the failure step can report it:
          # the log artifact is not reachable from every environment.
          node scripts/package-android-source.mjs 2>&1 | tee android-tv-build.log
          node scripts/package-android.mjs 2>&1 | tee -a android-tv-build.log
          node scripts/package-android-tv-app.mjs 2>&1 | tee -a android-tv-build.log
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try {
              tail = fs.readFileSync('android-tv-build.log', 'utf8').trim().split('\n').slice(-60).join('\n');
            } catch (e) { /* no log captured */ }
            throw new Error(
              'ChromiumCore Android TV packaging failed (node ' + process.version +
              '), commit ' + (context.sha || '?') + '.\n--- log tail ---\n' +
              (tail || '(no output captured)')
            );
      - uses: actions/upload-artifact@v4
        with:
          name: ChromiumCore-android-tv
          path: |
            public/download/ChromiumCore-1.0.0-android-universal.apk
            public/download/ChromiumCore-1.0.0-android-tv-source.zip
          if-no-files-found: error
      # The single file users want: the APK + INSTALL.md in one simple ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: ChromiumCore-android-tv-app
          path: public/download/ChromiumCore-1.0.0-android-tv-app.zip
          if-no-files-found: error

  # The convenience bundle: the Android TV APK, the Windows installer and the
  # Mac apps in ONE zip that extracts into three labelled folders. It runs
  # after every platform build, downloads all the release artifacts and
  # repackages them. It is an ADDITIONAL artifact — it never replaces the
  # per-platform ones (those are what the per-platform download links use).
  bundle:
    needs: [package, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Every artifact from this run lands in artifacts/<name>/.
          path: artifacts
      - name: Build the all-in-one bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ChromiumCore-all-in-one"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/windows" "$ROOT/mac" "$ROOT/android-tv"

          require() { if [ ! -f "$1" ]; then echo "Missing expected release file: $1" >&2; exit 1; fi; }
          WIN=artifacts/ChromiumCore-win32-x64/ChromiumCore-1.0.0-win32-x64.exe
          MAC_ARM=artifacts/ChromiumCore-darwin-arm64/ChromiumCore-1.0.0-darwin-arm64.zip
          MAC_X64=artifacts/ChromiumCore-darwin-x64/ChromiumCore-1.0.0-darwin-x64.zip
          APK=artifacts/ChromiumCore-android-tv/ChromiumCore-1.0.0-android-universal.apk
          require "$WIN"; require "$MAC_ARM"; require "$MAC_X64"; require "$APK"

          cp "$WIN"     "$ROOT/windows/"
          cp "$MAC_ARM" "$ROOT/mac/"
          cp "$MAC_X64" "$ROOT/mac/"
          cp "$APK"     "$ROOT/android-tv/"

          cat > "$ROOT/README.txt" <<'EOF'
          ChromiumCore — all three apps in one download
          =============================================
          Extract this archive and open the folder for your device:

          windows/
            ChromiumCore Setup .... .exe
            Double-click to install (Windows 10 or later). Because the build
            is unsigned, Windows SmartScreen may warn — choose More info,
            then Run.

          mac/
            Two ZIPs — use the one that matches your Mac:
              ChromiumCore-...-darwin-arm64.zip   Apple Silicon (M1 or newer)
              ChromiumCore-...-darwin-x64.zip     Intel
            Open the ZIP and drag ChromiumCore.app into Applications. macOS
            may flag it as unsigned — right-click the app, choose Open.

          android-tv/
            ChromiumCore-...-android-universal.apk
            Sideload it onto an Android TV / Google TV / Fire TV (allow
            installs from unknown sources in the TV's security settings).

          Every build is unsigned. If you want to be thorough, verify the
          SHA-256 of the file you install before running it.
          EOF

          ( cd "$ROOT" && find . -type f | sort | sed 's|^\./||' ) > "$ROOT/CONTENTS.txt"
          rm -f ChromiumCore-all-in-one.zip
          zip -qry ChromiumCore-all-in-one.zip "$ROOT"
          echo "=== ChromiumCore-all-in-one.zip ==="
          unzip -l ChromiumCore-all-in-one.zip
          du -h ChromiumCore-all-in-one.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChromiumCore-all-in-one
          path: ChromiumCore-all-in-one.zip
          if-no-files-found: error
