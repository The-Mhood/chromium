name: Build Desktop Preview
on:
  workflow_dispatch:
  push:
    tags: ['v*']
# contents:write lets the failure-report step write its log tail to the
# build-failure-logs branch (the report step must keep using github.token).
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          # macos-14 (Apple Silicon) is being retired by GitHub and its jobs
          # get cancelled within seconds; build arm64 on the current image.
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pkg
        shell: bash
        run: |
          # tee the output so the failure step can report it: the log
          # artifact is not reachable from every environment.
          node scripts/package-desktop.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} 2>&1 | tee package.log
          exit "${PIPESTATUS[0]}"
      # A failed package job appends its log tail to the build-failure-logs
      # branch, where it is readable via the API.
      - if: failure()
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            let content = '';
            try {
              content =
                'runner: ' + (process.env.RUNNER_OS || '?') + ' / node ' + process.version +
                '\ntarget: ${{ matrix.platform }} / ${{ matrix.arch }}\ncommit: ' + (context.payload.sha || '') +
                '\n\n```\n' +
                fs.readFileSync('package.log', 'utf8').trim().split('\n').slice(-70).join('\n') +
                '\n```\n';
            } catch (e) {
              content = 'no output captured: ' + (e && e.message ? e.message : e);
            }
            const branch = 'build-failure-logs';
            const path = 'failures/${{ matrix.platform }}-${{ matrix.arch }}-' + (context.payload.sha || 'unknown').slice(0, 8) + '.md';
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path, ref: branch,
              });
              sha = data.sha;
            } catch (e) { /* first write to this path */ }
            const payload = {
              owner: context.repo.owner, repo: context.repo.repo,
              message: 'packaging failure: ' + path,
              content: Buffer.from(content).toString('base64'),
              branch,
            };
            if (sha) {
              payload.path = path;
              payload.sha = sha;
              await github.rest.repos.updateFile(payload);
            } else {
              payload.path = path;
              await github.rest.repos.createFile(payload);
            }
            // and fail loudly so the run cannot be mistaken for a success
            throw new Error('packaging failed; log tail written to ' + path + ' on branch ' + branch);
      - uses: actions/upload-artifact@v4
        with:
          name: ChromiumCore-${{ matrix.platform }}-${{ matrix.arch }}
          path: public/download/ChromiumCore-*.zip
          if-no-files-found: error
